<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>red dot</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #111111;
    cursor: crosshair;
  }

  .dot {
    position: absolute;
    width: 12px;
    height: 12px;
    background: red;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

<script>
  document.addEventListener("click", function(event) {
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.left = event.clientX + "px";
    dot.style.top = event.clientY + "px";
    document.body.appendChild(dot);
  });
</script>

</body>
</html>
